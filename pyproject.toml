[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "musicxml-discovery"
version = "0.1.0"
description = "Rights-aware GitHub discovery and tonal/polyphonic screening for MusicXML"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Xavier Fresquet" }
]
keywords = ["MusicXML", "symbolic music", "computational musicology", "dataset"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/captaldebuch/musicxml-discovery"
Repository = "https://github.com/captaldebuch/musicxml-discovery"
Issues = "https://github.com/captaldebuch/musicxml-discovery/issues"

[project.scripts]
musicxml-discovery = "musicxml_discovery.cli:main"
musicxml-discovery-local = "musicxml_discovery.local_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/musicxml_discovery"]
